<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Stories</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pop's Stories">
<meta name="theme-color" content="#dcb980">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#26221d;--red:#b5271d;--yellow:#f2bd1d;--muted:#5a4a33;--line:rgba(38,34,29,.30);--faint:rgba(38,34,29,.38);--fs:28px;
  --hand:"Marker Felt","Noteworthy","Bradley Hand","Segoe Print",cursive;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  background-color:#dcb980;
  background-image:
    repeating-linear-gradient(1deg,rgba(110,70,25,.11) 0 2px,transparent 2px 11px,rgba(110,70,25,.07) 11px 12px,transparent 12px 27px),
    repeating-linear-gradient(179.3deg,rgba(255,240,205,.16) 0 3px,transparent 3px 37px),
    repeating-linear-gradient(0.4deg,rgba(90,55,20,.05) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,#e6c890,#d5af72)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}

/* start, lock, setup */
#start{align-items:center;justify-content:center;gap:26px;padding:24px}
#start img{max-height:56vh;max-width:76vw;border:3px solid var(--ink);border-radius:3px;box-shadow:5px 7px 0 rgba(38,34,29,.22)}
.big{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:var(--wob);min-height:84px;padding:0 30px;
  font-family:var(--hand);font-size:30px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:3px 4px 0 rgba(38,34,29,.25)}
.big svg{width:34px;height:34px;fill:var(--ink)}
.big:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(38,34,29,.25)}
#lock{align-items:center;justify-content:center;padding:28px}
#lockform{display:flex;flex-direction:column;align-items:stretch;gap:18px;width:min(86vw,440px)}
#lockform label{font-family:var(--hand);font-size:26px;color:var(--ink)}
#pw{font:inherit;font-family:-apple-system,system-ui,sans-serif;font-size:24px;padding:16px 18px;border:3px solid var(--ink);border-radius:6px;background:#f6ecd4;color:var(--ink);-webkit-user-select:text;user-select:text}
#lockform .big{justify-content:center}
#lockmsg{min-height:2.8em;font-family:-apple-system,system-ui,sans-serif;font-size:19px;font-weight:600;color:var(--red);text-align:center}
#setupbtn{font-family:var(--hand);color:var(--muted);font-size:20px;text-decoration:underline;min-height:48px;padding:0 16px}
#setup{align-items:center;justify-content:center;gap:22px;padding:28px;text-align:center}
#setup h2{margin:0;font-family:var(--hand);font-size:34px;font-weight:400;color:var(--ink)}
#setup p{margin:0;font-size:21px;line-height:1.4;max-width:30em}
#dlbar{width:min(84vw,520px);height:20px;background:#f6ecd4;border:2.5px solid var(--ink);border-radius:3px;overflow:hidden}
#dlfill{height:100%;width:0;background:var(--yellow);border-right:2.5px solid var(--ink)}
#dlstat{font-family:-apple-system,system-ui,sans-serif;font-size:19px;color:var(--muted);min-height:1.4em}
.plain{min-height:60px;padding:0 28px;border:2.5px solid var(--ink);border-radius:var(--wob);font-family:var(--hand);font-size:23px}
#start .sub{font-family:var(--hand);color:var(--muted);font-size:22px;text-align:center;min-height:1.3em;padding:0 12px}

/* player */
#head{padding:16px 22px 4px;text-align:center}
#part{font-family:-apple-system,system-ui,sans-serif;font-weight:600;color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title{font-family:var(--hand);font-size:31px;font-weight:400;color:var(--ink);margin:4px auto 0;line-height:1.12;display:inline-block;padding:0 6px 3px;
  border-bottom:3px solid var(--ink);border-radius:0 0 60% 40%/0 0 6px 9px}
#read{flex:1;min-height:0;position:relative;overflow:hidden;padding:0 28px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 24%,#000 62%,transparent 100%)}
#cur{position:relative;margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:400;font-size:var(--fs);
  line-height:1.62;text-align:left;color:var(--faint);transition:transform 1.1s cubic-bezier(.3,.1,.3,1);will-change:transform}
#cur span{transition:color 1.1s ease}
#cur .now{color:var(--ink)}
#cur .ttl{display:block;font-family:var(--hand);font-size:.8em;letter-spacing:.08em;margin-bottom:.8em}
#cur .par::before{content:"";display:block;height:.7em}
@media (prefers-reduced-motion:reduce){#cur,#cur span{transition-duration:.2s}}

/* progress: a tape measure, with a red pencil as the marker */
#bar{margin:0 16px;height:56px;display:flex;align-items:center}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:56px;margin:0;background:transparent;touch-action:none}
#seek::-webkit-slider-runnable-track{height:20px;border:2.5px solid var(--ink);border-radius:3px;background:
  linear-gradient(to right,rgba(38,34,29,.30) var(--pct,0%),transparent var(--pct,0%)),
  repeating-linear-gradient(90deg,rgba(38,34,29,.85) 0 2px,transparent 2px 10%),
  repeating-linear-gradient(90deg,rgba(38,34,29,.45) 0 1px,transparent 1px 2%),
  var(--yellow)}
#seek::-moz-range-track{height:16px;border:2.5px solid var(--ink);border-radius:3px;background:var(--yellow)}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:50px;margin-top:-18px;border-radius:5px 5px 9px 9px;border:2.5px solid var(--ink);
  background:linear-gradient(90deg,#8f1d15 0 22%,var(--red) 22% 78%,#8f1d15 78%);box-shadow:2px 3px 0 rgba(38,34,29,.28)}
#seek::-moz-range-thumb{width:20px;height:44px;border-radius:5px;border:2.5px solid var(--ink);background:var(--red)}
#times{display:flex;justify-content:space-between;margin:-2px 22px 0;color:var(--muted);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;font-family:-apple-system,system-ui,sans-serif}
#ctl{display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr;align-items:end;justify-items:center;gap:4px;padding:10px 10px 4px}
.c{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--hand);font-size:16px;color:var(--muted);width:100%}
.c .r{width:74px;height:74px;border-radius:50% 46% 52% 48%/48% 52% 46% 50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;background:rgba(246,236,212,.55)}
.c svg{width:34px;height:34px;fill:var(--ink)}
.c:active .r{background:rgba(38,34,29,.18)}
#play .r{width:100px;height:100px;background:var(--yellow);border-width:3.5px;box-shadow:3px 4px 0 rgba(38,34,29,.25)}
#play svg{width:46px;height:46px;fill:var(--ink)}
#play:active .r{background:#d9a614}

/* speed: slower / faster, with a rule that reads from the middle */
#speed{display:flex;align-items:center;gap:12px;padding:8px 18px 0}
#speed button{flex:0 0 104px;min-height:52px;border:2.5px solid var(--ink);border-radius:var(--wob);font-family:var(--hand);font-size:21px;background:rgba(246,236,212,.55)}
#speed button:active{background:rgba(38,34,29,.18)}
#speed button:disabled{opacity:.35}
#gauge{flex:1;height:30px;display:flex;align-items:flex-end;border-bottom:2.5px solid var(--ink)}
#gauge i{flex:1;height:9px;border-left:2px solid var(--ink);opacity:.4}
#gauge i.mid{height:18px;opacity:.75}
#gauge i.on{height:28px;border-left:6px solid var(--red);opacity:1}
#foot{display:flex;gap:12px;padding:8px 18px 12px}
#foot button{flex:1;min-height:56px;border:2.5px solid var(--ink);border-radius:var(--wob);font-family:var(--hand);font-size:23px;background:rgba(246,236,212,.55)}
#foot button:active{background:rgba(38,34,29,.18)}
#aa{flex:0 0 76px!important;font-family:Georgia,serif!important}

/* list */
#rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.ph{position:sticky;top:0;background:#cfa769;color:var(--ink);font-family:-apple-system,system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  padding:14px 22px 8px;border-bottom:2.5px solid var(--ink)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:10px 22px;text-align:left;border-bottom:1.5px solid var(--line);font-family:var(--hand);font-size:25px;line-height:1.2}
.row:active{background:rgba(38,34,29,.14)}
.row .n{flex:1}
.row .d{color:var(--muted);font-size:15px;font-weight:600;font-family:-apple-system,system-ui,sans-serif;white-space:nowrap}
.row .k{width:22px;color:var(--red);font-size:22px;text-align:center;font-family:-apple-system,system-ui,sans-serif;font-weight:700}
.row.on{background:rgba(242,189,29,.55)}
#listfoot{padding:10px 18px 14px;border-top:2.5px solid var(--ink)}
#listfoot button{width:100%;min-height:68px;border:3px solid var(--ink);border-radius:var(--wob);background:var(--yellow);color:var(--ink);font-family:var(--hand);font-size:26px}
@media (min-width:700px){:root{--fs:37px}#title{font-size:42px}#read{padding:10px 8vw}.row{font-size:30px;min-height:84px}
  .c .r{width:92px;height:92px}#play .r{width:124px;height:124px}.c{font-size:19px}#ctl{padding:14px 10vw 6px}#foot,#listfoot,#speed{padding-left:10vw;padding-right:10vw}#bar{margin:0 calc(10vw - 2px)}#times{margin-left:10vw;margin-right:10vw}}
@media (max-height:640px){#ctl{padding-top:4px}.c .r{width:62px;height:62px}#play .r{width:84px;height:84px}#speed button{min-height:44px}#foot button{min-height:46px}#bar{height:46px}}
</style>
</head>
<body>

<section class="screen" id="lock" hidden>
  <form id="lockform" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" enterkeyhint="go">
    <button class="big" type="submit">Open</button>
    <div id="lockmsg"></div>
  </form>
</section>

<section class="screen" id="start" hidden>
  <img id="cover" alt="">
  <button class="big" id="go"><svg viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></svg><span id="golabel">Play</span></button>
  <div class="sub" id="gosub"></div>
  <button id="setupbtn">Set up offline listening</button>
</section>

<section class="screen" id="setup" hidden>
  <h2>Offline listening</h2>
  <p id="dlmsg">This saves all 79 stories on this device (about 345&nbsp;MB) so they play without the internet. Use Wi-Fi and keep this screen open until it finishes.</p>
  <div id="dlbar"><div id="dlfill"></div></div>
  <div id="dlstat"></div>
  <button class="big" id="dlgo">Download all stories</button>
  <button class="plain" id="dlback">Back</button>
</section>

<section class="screen" id="player" hidden>
  <div id="head"><div id="part"></div><div id="title"></div></div>
  <div id="read" aria-live="off"><p id="cur"></p></div>
  <div id="bar"><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position in the story"></div>
  <div id="times"><span id="tc">0:00</span><span id="tr"></span></div>
  <div id="ctl">
    <button class="c" id="pst" aria-label="Previous story"><span class="r"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></span>Last story</button>
    <button class="c" id="b30" aria-label="Back 30 seconds"><span class="r"><svg viewBox="0 0 24 24"><path d="M12 5V1.5L6.5 6 12 10.5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.3" font-size="6.4" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="700">30</text></svg></span>Back 30</button>
    <button class="c" id="play" aria-label="Play or pause"><span class="r"><svg viewBox="0 0 24 24"><path id="pi" d="M7 4v16l14-8z"/></svg></span><span id="pl">Play</span></button>
    <button class="c" id="nst" aria-label="Next story"><span class="r"><svg viewBox="0 0 24 24"><path d="M15.500 5H18v14h-2.500zM4 5v14l10.500-7z"/></svg></span>Next story</button>
  </div>
  <div id="speed"><button id="slower" aria-label="Read slower">Slower</button><div id="gauge" aria-hidden="true"></div><button id="faster" aria-label="Read faster">Faster</button></div>
  <div id="foot"><button id="open">All stories</button><button id="aa" aria-label="Text size">Aa</button></div>
</section>

<section class="screen" id="list" hidden>
  <div id="rows"></div>
  <div id="listfoot"><button id="close">Back to the story</button></div>
</section>

<audio id="au" preload="metadata" playsinline></audio>

<script>
let STORIES=[], META={title:"",author:""};
const $=id=>document.getElementById(id), au=$('au');
const KEY='pop.stories.v1';
let st={i:0,t:0,done:{},fs:1,sp:0}, cues=[], ci=-1, cuesFor=-1, wantPlay=false;
let words=[], chunks=[], wi=-1, seeking=false;
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
const mins=s=>{const m=Math.max(1,Math.round(s/60));return m<60?m+' min':Math.floor(m/60)+' hr '+(m%60?m%60+' min':'')};
const SIZES=[24,28,34,42], SP_MID=.9, SP_STEP=.025, SP_MAX=6;
function applySize(){const big=window.innerWidth>=700?1.33:1;document.documentElement.style.setProperty('--fs',Math.round(SIZES[st.fs]*big)+'px');if(words.length){setTimeout(()=>place(ci),60)}}
if(!(st.fs>=0&&st.fs<SIZES.length))st.fs=1;
if(!(Number.isInteger(st.sp)&&Math.abs(st.sp)<=SP_MAX))st.sp=0;
/* The middle of the rule is the normal reading pace (a touch under the narration's own speed). */
const rateNow=()=>Math.round((SP_MID+st.sp*SP_STEP)*1000)/1000;
function applyRate(){const r=rateNow();try{au.preservesPitch=true;au.webkitPreservesPitch=true}catch(e){}
  try{au.defaultPlaybackRate=r;au.playbackRate=r}catch(e){}
  const G=$('gauge');if(!G.children||!G.children.length){for(let k=-SP_MAX;k<=SP_MAX;k++){const t=document.createElement('i');if(k===0)t.className='mid';G.appendChild(t)}}
  for(let k=0;k<G.children.length;k++){const base=(k===SP_MAX)?'mid':'';G.children[k].className=(k===st.sp+SP_MAX)?(base+' on').trim():base}
  $('slower').disabled=st.sp<=-SP_MAX;$('faster').disabled=st.sp>=SP_MAX}
/* Each story's text arrives as sentences: [start seconds, text, kind] where kind 1 is the title and 2 starts a paragraph. */
function render(){const P=$('cur');ci=-1;P.textContent='';
  words.forEach((s,j)=>{const e=document.createElement('span');e.textContent=s[1];if(s[2]===1)e.className='ttl';else if(s[2]===2&&j>0)e.className='par';
    P.appendChild(e);P.appendChild(document.createTextNode(' '))});
  place(-1);if(ready)tick()}
function place(k){const P=$('cur'),R=$('read'),H=R.clientHeight||0;let y=H*.4;
  if(k>=0){const s=P.querySelectorAll('span')[k];if(s){y=H*.4-(s.offsetTop+Math.min(s.offsetHeight||0,H*.3)/2)}}
  P.style.transform='translateY('+Math.round(y)+'px)'}
function paint(t){if(!words.length)return;
  let lo=0,hi=words.length-1,k=0;while(lo<=hi){const m=(lo+hi)>>1;if(words[m][0]<=t){k=m;lo=m+1}else hi=m-1}
  if(k===ci)return;
  const sp=$('cur').querySelectorAll('span');
  if(ci>=0&&sp[ci])sp[ci].classList.remove('now');
  if(sp[k])sp[k].classList.add('now');
  ci=k;place(k)}

function load(i,t,autoplay){
  st.i=i;st.t=t||0;save();
  const s=STORIES[i];
  $('title').textContent=s.t;$('part').textContent=s.p;
  $('cur').textContent='';$('cur').style.transform='translateY('+Math.round(($('read').clientHeight||0)*.4)+'px)';ci=-1;wi=-1;cues=[];words=[];chunks=[];cuesFor=-1;
  wantPlay=!!autoplay;
  const myLoad=++loadSeq;ready=false;
  srcFor(s.id).then(u=>{ if(myLoad!==loadSeq)return; setSrc(u,myLoad); }).catch(()=>{ if(myLoad===loadSeq&&!words.length){const P=$('cur');P.textContent='';const s=document.createElement('span');s.className='now';s.textContent='This story could not be loaded. Check the connection and try again.';P.appendChild(s)} });
  getText(s.id).then(c=>{if(st.i===i){words=c;cuesFor=i;render();tick()}}).catch(()=>{});
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:s.t,artist:META.author,album:META.title,artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}catch(e){}}
  markRows();
}
let loadSeq=0, blobUrl=null, ready=false, unlocked=false;
const SILENT='data:audio/wav;base64,UklGRvQHAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YdAHAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
/* iOS only lets audio start from a tap. Playing a moment of silence inside the tap keeps the element allowed to play after the story has been read from storage. */
function unlock(){if(unlocked)return;unlocked=true;try{ready=false;au.src=SILENT;const p=au.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
const MEDIA='ps2-media-v1', KS='pop.key.v1';
const aurl=id=>'d/a'+id+'.bin', turl=id=>'d/s'+id+'.bin';
async function cached(u){try{const c=await caches.open(MEDIA);return await c.match(u)}catch(e){return null}}
/* Everything under d/ is AES-GCM encrypted: 12 bytes of IV, then ciphertext. The key comes from the password and is kept on this device after the first unlock. */
let KEYOBJ=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveRaw(pass,salt,n){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:n},km,256))}
async function useRaw(raw){KEYOBJ=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12)},KEYOBJ,u.subarray(12))}
async function getBytes(u,keep){const r=await cached(u);if(r)return r.arrayBuffer();
  const n=await fetch(u);if(!n.ok)throw new Error('net');
  if(keep){try{const c=await caches.open(MEDIA);await c.put(u,n.clone())}catch(e){}}
  return n.arrayBuffer()}
async function srcFor(id){return URL.createObjectURL(new Blob([await dec(await getBytes(aurl(id)))],{type:'audio/mp4'}))}
function setSrc(u,token){
  const old=blobUrl;blobUrl=u.startsWith('blob:')?u:null;
  const f=()=>{ if(token!==loadSeq||au.src.startsWith('data:'))return; au.removeEventListener('loadedmetadata',f);
    if(st.t>1&&st.t<au.duration-3){try{au.currentTime=st.t}catch(e){}}
    ready=true; applyRate(); if(wantPlay){const p=au.play();if(p&&p.catch)p.catch(()=>{})} tick(); setIcon() };
  au.addEventListener('loadedmetadata',f);
  au.src=u;au.load();
  if(old){setTimeout(()=>{try{URL.revokeObjectURL(old)}catch(e){}},1000)}
}
async function getText(id){return JSON.parse(new TextDecoder().decode(await dec(await getBytes(turl(id)))))}

/* offline download */
let dlBusy=false;
async function countSaved(){let n=0;try{const c=await caches.open(MEDIA);const keys=await c.keys();const have=new Set(keys.map(k=>new URL(k.url).pathname.split('/').slice(-2).join('/')));
  for(const s of STORIES)if(have.has(aurl(s.id))&&have.has(turl(s.id)))n++}catch(e){}return n}
async function dlRefresh(){const n=await countSaved(),N=STORIES.length;
  $('dlfill').style.width=(n/N*100)+'%';
  if(n===N){$('dlstat').textContent='All '+N+' stories are saved on this device.';$('dlgo').hidden=true;$('setupbtn').textContent='Saved for offline listening ✓'}
  else{$('dlstat').textContent=n?n+' of '+N+' saved':'';$('dlgo').hidden=false;$('dlgo').textContent=n?'Carry on downloading':'Download all stories'}
  return n}
async function dlAll(){if(dlBusy)return;dlBusy=true;$('dlgo').hidden=true;
  let lock=null;try{lock=await navigator.wakeLock.request('screen')}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  const N=STORIES.length;let fail=0;
  try{const c=await caches.open(MEDIA);
    for(let i=0;i<N;i++){const s=STORIES[i];
      for(const u of [turl(s.id),aurl(s.id)]){
        if(await c.match(u))continue;
        try{const r=await fetch(u,{cache:'no-store'});if(!r.ok||r.status!==200)throw 0;await c.put(u,r)}
        catch(e){fail++}
      }
      $('dlfill').style.width=((i+1)/N*100)+'%';$('dlstat').textContent='Saving '+(i+1)+' of '+N+' — '+s.t;
    }
  }catch(e){fail++}
  try{lock&&lock.release()}catch(e){}
  dlBusy=false;const n=await dlRefresh();
  if(n<N)$('dlstat').textContent=n+' of '+N+' saved. '+(fail?'Some did not download — check the connection and tap the button again.':'')}
$('setupbtn').onclick=()=>{show('setup');dlRefresh()};$('dlback').onclick=()=>show('start');$('dlgo').onclick=dlAll;

function tick(){
  const S=$('seek');
  if(!ready){if(!seeking){S.value=0;S.style.setProperty('--pct','0%')}$('tc').textContent=fmt(st.t);$('tr').textContent='';return}
  const t=au.currentTime||0,d=au.duration||STORIES[st.i].d;
  if(!seeking){const p=d?Math.min(1,t/d):0;S.value=Math.round(p*1000);S.style.setProperty('--pct',(p*100)+'%');
    $('tc').textContent=fmt(t);$('tr').textContent='−'+fmt(d-t)}
  if(cuesFor!==st.i||!words.length)return;
  paint(t);
}
/* progress slider: drag to move through the story */
(function(){const S=$('seek');
  const dur=()=>au.duration||STORIES[st.i].d;
  S.addEventListener('input',()=>{seeking=true;const p=S.value/1000;S.style.setProperty('--pct',(p*100)+'%');$('tc').textContent=fmt(p*dur());$('tr').textContent='−'+fmt((1-p)*dur())});
  const commit=()=>{if(!seeking)return;seeking=false;if(!ready)return;const d=dur();try{au.currentTime=Math.min(Math.max(0,d-1),S.value/1000*d)}catch(e){}st.t=au.currentTime||0;save();tick()};
  S.addEventListener('change',commit);S.addEventListener('touchend',()=>setTimeout(commit,0));S.addEventListener('pointerup',()=>setTimeout(commit,0));
})();
function setIcon(){const p=ready?!au.paused:wantPlay;$('pi').setAttribute('d',p?'M6 4h4.500v16H6zM13.500 4H18v16h-4.500z':'M7 4v16l14-8z');$('pl').textContent=p?'Pause':'Play'}
function toggle(){if(!ready){wantPlay=!wantPlay;setIcon();return}if(au.paused){au.play().catch(()=>{})}else au.pause()}
function back30(){if(!ready)return;au.currentTime=Math.max(0,(au.currentTime||0)-30);tick()}
function nextStory(auto){if(st.i<STORIES.length-1)load(st.i+1,0,true);else if(auto){au.pause()}}
function prevStory(){if(ready&&(au.currentTime||0)>8){au.currentTime=0;tick()}else if(st.i>0)load(st.i-1,0,ready?!au.paused:wantPlay);else{au.currentTime=0;tick()}}

au.addEventListener('timeupdate',()=>{if(!ready)return;tick();const t=au.currentTime||0;if(Math.abs(t-st.t)>4){st.t=t;save()}});
au.addEventListener('play',()=>{setIcon();if(ready&&Math.abs(au.playbackRate-rateNow())>.001)applyRate()});au.addEventListener('pause',()=>{setIcon();if(ready){st.t=au.currentTime||0;save()}});
au.addEventListener('ended',()=>{if(!ready)return;st.done[STORIES[st.i].id]=1;save();nextStory(true)});
$('play').onclick=toggle;$('b30').onclick=back30;$('nst').onclick=()=>nextStory(false);$('pst').onclick=prevStory;
$('aa').onclick=()=>{st.fs=(st.fs+1)%SIZES.length;save();applySize()};
$('slower').onclick=()=>{if(st.sp>-SP_MAX){st.sp--;save();applyRate()}};$('faster').onclick=()=>{if(st.sp<SP_MAX){st.sp++;save();applyRate()}};
if('mediaSession' in navigator){const ms=navigator.mediaSession,h=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};
  h('play',()=>au.play());h('pause',()=>au.pause());h('seekbackward',back30);h('previoustrack',prevStory);h('nexttrack',()=>nextStory(false))}

/* list */
function buildRows(){const R=$('rows');let part=null;
  STORIES.forEach((s,i)=>{if(s.p!==part){part=s.p;const h=document.createElement('div');h.className='ph';h.textContent=part;R.appendChild(h)}
    const b=document.createElement('button');b.className='row';b.dataset.i=i;
    b.innerHTML='<span class="k"></span><span class="n"></span><span class="d"></span>';
    b.children[1].textContent=s.t;b.children[2].textContent=mins(s.d);
    b.onclick=()=>{show('player');if(i!==st.i)load(i,0,true);else if(ready&&au.paused)au.play().catch(()=>{})};R.appendChild(b)})}
function markRows(){document.querySelectorAll('.row').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('on',i===st.i);b.firstChild.textContent=st.done[STORIES[i].id]?'✓':''})}
function show(id){['lock','start','player','list','setup'].forEach(x=>$(x).hidden=x!==id);
  if(id==='list'){markRows();const on=document.querySelector('.row.on');if(on)on.scrollIntoView({block:'center'})}}
$('open').onclick=()=>show('list');$('close').onclick=()=>show('player');

/* unlock, then start */
async function openIndex(raw){await useRaw(raw);return JSON.parse(new TextDecoder().decode(await dec(await getBytes('d/i.bin',true))))}
async function init(idx){
  META=idx;STORIES=idx.stories;
  if(!(st.i>=0&&st.i<STORIES.length)){st.i=0;st.t=0}
  try{document.title=idx.title}catch(e){}
  getBytes('d/c.bin',true).then(dec).then(b=>{$('cover').src=URL.createObjectURL(new Blob([b],{type:'image/jpeg'}));$('cover').alt=idx.title+', by '+idx.author}).catch(()=>{});
  const resuming=st.t>5||st.i>0;
  $('golabel').textContent=resuming?'Keep listening':'Play';
  $('gosub').textContent=resuming?STORIES[st.i].t:'';
  $('rows').textContent='';buildRows();
  if(!('caches' in window)){$('setupbtn').hidden=true}else{countSaved().then(n=>{if(n===STORIES.length)$('setupbtn').textContent='Saved for offline listening ✓'})}
  show('start');
}
$('go').onclick=()=>{unlock();show('player');load(st.i,st.t,true)};
$('lockform').onsubmit=async e=>{e.preventDefault();
  const p=$('pw').value.trim().toLowerCase().replace(/\s+/g,' ');if(!p)return;
  if(!(window.crypto&&crypto.subtle)){$('lockmsg').textContent='Open this page from its https address.';return}
  $('lockmsg').textContent='Opening…';
  let kp;try{const r=await fetch('k.json',{cache:'no-store'});if(!r.ok)throw 0;kp=await r.json()}catch(err){$('lockmsg').textContent='No connection. Try again on Wi-Fi.';return}
  let raw,idx;
  try{raw=await deriveRaw(p,b64(kp.s),kp.n)}catch(err){$('lockmsg').textContent='Something went wrong. Try again.';return}
  try{idx=await openIndex(raw)}catch(err){KEYOBJ=null;$('lockmsg').textContent=(err&&err.message==='net')?'No connection. Try again on Wi-Fi.':'That password did not work. Check it and try again.';return}
  try{localStorage.setItem(KS,btoa(String.fromCharCode.apply(null,raw)))}catch(err){}
  $('lockmsg').textContent='';$('pw').value='';init(idx)};
async function boot(){let saved=null;try{saved=localStorage.getItem(KS)}catch(e){}
  if(saved&&window.crypto&&crypto.subtle){try{return init(await openIndex(b64(saved)))}catch(e){KEYOBJ=null}}
  show('lock')}
document.addEventListener('keydown',e=>{if($('player').hidden)return;if(e.key===' '){e.preventDefault();toggle()}else if(e.key==='ArrowLeft')back30();else if(e.key==='ArrowRight')nextStory(false)});
window.addEventListener('resize',applySize);
applySize();applyRate();boot();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
